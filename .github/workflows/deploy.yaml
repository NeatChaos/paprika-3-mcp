name: deploy

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: cloud
      url: ${{ steps.apply.outputs.run_url }}
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      TF_VAR_project_id: ${{ vars.GCP_PROJECT }}
      TF_VAR_allowed_emails: ${{ vars.ALLOWED_EMAILS }}
      TF_VAR_access_team_domain: ${{ vars.ACCESS_TEAM_DOMAIN }}
      TF_VAR_access_aud: ${{ vars.ACCESS_AUD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_EMAIL }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Terraform init
        run: terraform -chdir=infra init -input=false -backend-config="bucket=${GCP_PROJECT}-tfstate"
      - name: Build and push image
        id: image
        run: |
          REPO="$(terraform -chdir=infra output -raw artifact_repo)"
          gcloud auth configure-docker "${REPO%%/*}" --quiet
          docker build --build-arg VERSION="${GITHUB_SHA::7}" -t "${REPO}/server:${GITHUB_SHA}" .
          docker push "${REPO}/server:${GITHUB_SHA}"
          echo "image=$(docker inspect --format '{{index .RepoDigests 0}}' "${REPO}/server:${GITHUB_SHA}")" >> "$GITHUB_OUTPUT"
      - name: Terraform apply
        id: apply
        env:
          TF_VAR_image: ${{ steps.image.outputs.image }}
        run: |
          terraform -chdir=infra apply -input=false -auto-approve
          echo "run_url=$(terraform -chdir=infra output -raw run_url)" >> "$GITHUB_OUTPUT"
